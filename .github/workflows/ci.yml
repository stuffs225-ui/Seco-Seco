name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: فحص التطبيق
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: التحقق من الأنواع
        run: npm run typecheck

      - name: التدقيق اللغوي
        run: npm run lint

      - name: تنسيق الملفات
        run: npm run format:check

      - name: اختبارات الوحدة
        run: npm run test

      # docs/bootstrap.sql مولَّد من الترحيلات. لو تغيّرت ولم يُعَد توليده
      # تحوّل إلى وثيقة كاذبة تبني قاعدة ناقصة — وهذا أسوأ من عدم وجوده.
      - name: التأكد من تطابق bootstrap.sql مع الترحيلات
        run: npm run bootstrap:check

      # البناء يكشف ما لا تكشفه فحوص الأنواع: أخطاء التصيير المسبق
      # وجمع بيانات الصفحات. القيم هنا وهمية صالحة الشكل — الغرض إثبات
      # أن البناء يمر، لا الاتصال بقاعدة حقيقية.
      - name: بناء التطبيق
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database:
    name: اختبارات قاعدة البيانات
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: تشغيل Supabase محلياً
        run: supabase start

      # يعيد بناء القاعدة من الترحيلات وحدها — يثبت أن كل تغيير موجود كملف ترحيل
      # وأن الترحيلات تعمل من الصفر، لا من حالة قائمة.
      - name: إعادة بناء القاعدة من الترحيلات
        run: supabase db reset

      # اختبارات القبول في البنود 14 و23 و27 من الخطة الرئيسية
      - name: اختبارات قواعد الأعمال (pgTAP)
        run: supabase test db

      # الترحيلات يجب أن تصف حالة القاعدة بالكامل.
      # db diff يطبع الفرق ويخرج بصفر حتى حين يوجد فرق، فنفحص المخرج بأنفسنا.
      - name: التأكد من عدم وجود فروقات غير مرحّلة
        run: |
          diff_output="$(supabase db diff --schema public)"
          if [ -n "$diff_output" ]; then
            echo "::error::يوجد فرق بين الترحيلات وحالة القاعدة:"
            echo "$diff_output"
            exit 1
          fi
          echo "لا فروقات — الترحيلات تصف القاعدة بالكامل."
