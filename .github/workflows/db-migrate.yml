name: نشر ترحيلات قاعدة البيانات

# يطبّق الترحيلات على مشروع Supabase الإنتاجي عند الدمج في main.
# لا يُعدَّل شيء في القاعدة يدوياً من لوحة Supabase — هذا هو المسار الوحيد.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# نشرة واحدة في كل مرة — نشرتان متوازيتان قد تتعارضان على نفس القاعدة.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: تطبيق الترحيلات
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: الربط بالمشروع
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: تطبيق الترحيلات
        run: supabase db push
